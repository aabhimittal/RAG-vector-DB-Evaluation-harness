name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (dev extras only — core has no runtime deps)
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests (offline / deterministic)
        run: python -m pytest -q

      - name: Smoke-test the CLI (hybrid retrieval + reliability report)
        run: |
          python -m rag_harness.cli eval \
            --corpus data/corpus.jsonl \
            --eval data/eval_set.jsonl \
            --retrieval-mode hybrid

      - name: Smoke-test the examples
        run: |
          python examples/quickstart.py
          python examples/advanced.py
